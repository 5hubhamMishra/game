services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: between_words
      POSTGRES_USER: between_words
      POSTGRES_PASSWORD: between_words_dev
    ports: ['5432:5432']
    volumes: [between_words_pg:/var/lib/postgresql/data, ./db/migrations:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U between_words -d between_words'], interval: 5s, timeout: 5s, retries: 10 }
volumes:
  between_words_pg:
