services:
  - type: web
    name: between-words-game-server
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev
    startCommand: npm run start -w apps/game-server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
